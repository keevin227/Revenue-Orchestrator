<head>

<title>Revenue Orchestrator</title>
<meta name="theme-color" content="#05060a">

<style id="gate-css">
  :root { --bg: #05060a; --panel: #0c0e15; --line: rgba(255,255,255,.14); --text: #f3f5f9; --muted: #8a92a6; --gold: #ffc65c; --vi: #a395ff; --red: #ff6b6b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .gate { min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(900px 600px at 50% 40%, #0d0f1b 0%, var(--bg) 70%); }
  .box { width: 100%; max-width: 420px; text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 50%; border: 1px solid rgba(163,149,255,.5);
    display: grid; place-items: center; box-shadow: 0 0 60px rgba(163,149,255,.25); }
  .mark i { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 18px var(--gold); }
  .kicker { font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 40px; line-height: 1.05; letter-spacing: -.035em; font-weight: 750; margin: 14px 0 10px; }
  p.sub { color: var(--muted); font-size: 15px; margin-bottom: 30px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 50px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 16px; outline: none; }
  input:focus { border-color: var(--vi); box-shadow: 0 0 0 3px rgba(163,149,255,.2); }
  button { height: 50px; padding: 0 22px; border: 0; border-radius: 12px; font: 650 15px/1 inherit; font-family: inherit;
    color: #120d02; background: var(--gold); cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { min-height: 22px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--red); }
  .lang { position: fixed; top: 20px; right: 20px; height: 38px; color: var(--text); background: var(--panel); border: 1px solid var(--line); }
  html[lang="fa"] body { font-family: "Vazirmatn", Tahoma, sans-serif; }
  html[lang="fa"] h1 { letter-spacing: 0; line-height: 1.35; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>

<script>
(() => {
  const data = JSON.parse(document.getElementById('payload').textContent);
  const form = document.getElementById('form'), pw = document.getElementById('pw');
  const go = document.getElementById('go'), msg = document.getElementById('msg');
  const KEY = 'ro-deck-key';
  const language = new URL(location.href).searchParams.get('lang') || localStorage.getItem('deck-language') || 'en';
  if (language === 'fa') {
    document.documentElement.lang = 'fa'; document.documentElement.dir = 'rtl';
    document.title = 'ارکستریتور درآمد';
    document.querySelector('.kicker').textContent = 'پیش‌نمایش خصوصی';
    document.querySelector('.box h1').textContent = 'ارکستریتور درآمد';
    document.querySelector('.box .sub').textContent = 'برای مشاهدهٔ ارائه، رمز را وارد کنید.';
    pw.placeholder = 'رمز عبور'; pw.setAttribute('aria-label', 'رمز عبور');
    go.textContent = 'ورود';
  }
  const languageButton = document.getElementById('language');
  languageButton.textContent = language === 'fa' ? 'EN' : 'فا';
  languageButton.addEventListener('click', () => {
    const next = language === 'fa' ? 'en' : 'fa';
    localStorage.setItem('deck-language', next);
    const url = new URL(location.href); url.searchParams.set('lang', next); location.assign(url.href);
  });
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const store = {
    get() { try { return sessionStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { sessionStorage.setItem(KEY, v); } catch { /* private mode: ask again next time */ } },
    clear() { try { sessionStorage.removeItem(KEY); } catch { } },
  };

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(data.salt), iterations: data.iter },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(data.iv) }, key, u8(data.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function mount(deck) {
    document.getElementById('gate').remove();
    document.getElementById('gate-css').remove();
    document.getElementById('payload').remove();
    document.head.insertAdjacentHTML('beforeend', deck.head);
    document.body.insertAdjacentHTML('afterbegin', deck.body);
    for (const code of deck.scripts) {
      const s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    }
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    go.disabled = true; msg.className = 'msg'; msg.textContent = language === 'fa' ? 'در حال باز کردن…' : 'Unlocking…';
    try {
      const key = await deriveKey(pw.value);
      const deck = await open(key);
      store.set(b64(await crypto.subtle.exportKey('raw', key)));
      mount(deck);
    } catch {
      go.disabled = false; msg.className = 'msg err'; msg.textContent = language === 'fa' ? 'رمز نادرست است.' : 'Wrong password.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      pw.select();
    }
  });

  // Same tab, already unlocked: skip the prompt on reload.
  const saved = store.get();
  if (saved) {
    crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', false, ['decrypt'])
      .then(open).then(mount).catch(() => store.clear());
  }
})();
</script>
